<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}ToolsHub - Ferramentas Online Grátis{% endblock %}</title>

  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Space Grotesk"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          },
          colors: {
            neoGreen: '#B8FF57',
            neoPink: '#FF6B97',
            neoPurple: '#6C5CE7',
            neoYellow: '#FDCB6E',
            neoBlue: '#54A0FF',
          },
          boxShadow: {
            'neo': '4px 4px 0px 0px #000000',
            'neo-lg': '6px 6px 0px 0px #000000',
            'neo-sm': '2px 2px 0px 0px #000000',
          }
        }
      }
    }
  </script>

  <style>
    /* Padrão quadriculado de fundo */
    .bg-grid {
      background-size: 24px 24px;
      background-image: linear-gradient(to right, rgba(0, 0, 0, 0.07) 1px, transparent 1px),
                        linear-gradient(to bottom, rgba(0, 0, 0, 0.07) 1px, transparent 1px);
    }
  </style>
</head>
<body class="bg-[#F8F9FA] bg-grid text-black font-sans min-h-screen flex flex-col selection:bg-neoGreen selection:text-black">

  <!-- Header / Navbar estilo janela retrô/neobrutalista -->
  <header class="border-b-4 border-black bg-white sticky top-0 z-50">
    <div class="max-w-6xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-4">
      <a href="{% url 'converter_view' %}" class="inline-flex items-center gap-2 px-3 py-1.5 bg-neoGreen border-2 border-black shadow-neo-sm font-mono font-bold tracking-tight text-lg hover:translate-x-0.5 hover:translate-y-0.5 hover:shadow-none transition-all">
        <span>&lt;/&gt;</span>
        <span>TOOLSHUB.DEV</span>
      </a>

      <nav class="flex items-center gap-3 text-sm font-bold">
        <a href="{% url 'converter_view' %}" class="px-3 py-1 bg-white border-2 border-black shadow-neo-sm hover:bg-neoYellow transition-all">Conversor de Imagens</a>
        <span class="px-3 py-1 bg-gray-200 border-2 border-black opacity-60 cursor-not-allowed">Removedor Fundo (em breve)</span>
      </nav>

      <div>
        <span class="inline-block px-3 py-1 bg-neoPurple text-white border-2 border-black shadow-neo-sm font-mono text-xs font-bold uppercase">
          100% Grátis &amp; Sem Login
        </span>
      </div>
    </div>
  </header>

  <!-- Conteúdo Principal -->
  <main class="flex-grow max-w-6xl w-full mx-auto px-4 py-8">
    {% block content %}
    {% endblock %}
  </main>

  <!-- Footer -->
  <footer class="border-t-4 border-black bg-white mt-12 py-4">
    <div class="max-w-6xl mx-auto px-4 flex flex-col md:flex-row justify-between items-center gap-2 font-mono text-xs font-bold">
      <p>© 2026 ToolsHub - Seus arquivos não ficam salvos no servidor.</p>
      <div class="flex gap-4">
        <span>Zero Storage</span>
        <span>•</span>
        <span>Em Memória RAM</span>
      </div>
    </div>
  </footer>

</body>
</html>
